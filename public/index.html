<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dot Dodge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
    }
    #gameCanvas {
      border: 2px solid #444;
      border-radius: 8px;
      background: #16213e;
    }
    .controls {
      margin-top: 16px;
      font-size: 0.9rem;
      color: #888;
      text-align: center;
    }
    .status {
      margin-top: 8px;
      font-size: 0.85rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="800" height="500"></canvas>
  <div class="controls">Arrow keys to move • Space to restart</div>
  <div class="status" id="status"></div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');

    // Game constants
    const PLAYER_RADIUS = 12;
    const ENEMY_RADIUS = 18;
    const PLAYER_SPEED = 2;
    const ENEMY_SPEED = 2;
    const AI_INTERVAL = 400; // ms between AI moves

    // Game state
    let player = { x: 60, y: canvas.height / 2 };
    let enemy = { x: canvas.width - 60, y: canvas.height / 2 };
    let isRunning = false;
    let isGameOver = false;
    let lastAiMove = 0;
    let move = { up: 0, down: 0, left: 0, right: 0 };

    // Player movement
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if (e.key === ' ' && (isGameOver || !isRunning)) {
        resetGame();
      }
      // Prevent scrolling
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
        e.preventDefault();
      }
    });
    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    function resetGame() {
      player = { x: PLAYER_RADIUS + 10, y: canvas.height / 2 };
      enemy = { x: canvas.width - ENEMY_RADIUS - 10, y: canvas.height / 2 };
      isRunning = true;
      isGameOver = false;
      statusDiv.textContent = 'Game running...';
    }

    async function getEnemyMove() {
      try {
        const response = await fetch('/api/enemy-move', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            player: { x: player.x, y: player.y },
            enemy: { x: enemy.x, y: enemy.y }
          })
        });
        if (!response.ok) throw new Error('API call failed');
        const data = await response.json();
        return data.probabilities; // Expected format: { up: 0.1, down: 0.2, left: 0.3, right: 0.4 }
      } catch (error) {
        console.error('Error getting enemy move:', error);
        // Fallback: simple tracking
        if (enemy.x < player.x) return {'right': 1, 'left': 0, 'up': 0, 'down': 0};
        if (enemy.x > player.x) return {'left': 1, 'right': 0, 'up': 0, 'down': 0};
        if (enemy.y < player.y) return {'down': 1, 'up': 0, 'left': 0, 'right': 0};
        return {'up': 1, 'down': 0, 'left': 0, 'right': 0};
      }
    }

    async function updateEnemy() {
      if (!isRunning || isGameOver) return;

      const now = Date.now();
      if (now - lastAiMove > AI_INTERVAL){
        lastAiMove = now;  
        move = await getEnemyMove();
      };
      
      const startX = enemy.x;
      const startY = enemy.y;
      
      const dx = player.x - enemy.x;
      const dy = player.y - enemy.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist === 0) return;

      enemy.y -= (ENEMY_SPEED) * move.up;
      enemy.y += (ENEMY_SPEED) * move.down;
      enemy.x -= (ENEMY_SPEED) * move.left;
      enemy.x += (ENEMY_SPEED) * move.right;

      /*switch (move) {
        case 'up':
          enemy.y -= ENEMY_SPEED * (dy < 0 ? 1 : 0.5);
          break;
        case 'down':
          enemy.y += ENEMY_SPEED * (dy > 0 ? 1 : 0.5);
          break;
        case 'left':
          enemy.x -= ENEMY_SPEED * (dx < 0 ? 1 : 0.5);
          break;
        case 'right':
          enemy.x += ENEMY_SPEED * (dx > 0 ? 1 : 0.5);
          break;
      }*/

      const newDx = player.x - enemy.x;
      const newDy = player.y - enemy.y;
      const newDist = Math.sqrt(newDx * newDx + newDy * newDy);

      if (newDist > dist) {
        enemy.x = startX;
        enemy.y = startY;
      }

    }

    function updatePlayer() {
      if (!isRunning || isGameOver) return;

      if (keys['ArrowUp']) player.y -= PLAYER_SPEED;
      if (keys['ArrowDown']) player.y += PLAYER_SPEED;
      if (keys['ArrowLeft']) player.x -= PLAYER_SPEED;
      if (keys['ArrowRight']) player.x += PLAYER_SPEED;

      // Keep player in bounds
      player.x = Math.max(PLAYER_RADIUS, Math.min(canvas.width - PLAYER_RADIUS, player.x));
      player.y = Math.max(PLAYER_RADIUS, Math.min(canvas.height - PLAYER_RADIUS, player.y));
    }

    function checkCollision() {
      if (!isRunning) return false;
      const dx = player.x - enemy.x;
      const dy = player.y - enemy.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      return dist < (PLAYER_RADIUS + ENEMY_RADIUS);
    }

    function draw() {
      // Clear
      ctx.fillStyle = '#16213e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw grid lines (subtle)
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += 50) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();
      }
      for (let i = 0; i < canvas.height; i += 50) {
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Draw player (blue dot)
      ctx.beginPath();
      ctx.arc(player.x, player.y, PLAYER_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = '#4a90d9';
      ctx.fill();
      ctx.strokeStyle = 'rgba(74, 144, 217, 0.5)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Draw enemy (red dot)
      ctx.beginPath();
      ctx.arc(enemy.x, enemy.y, ENEMY_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = '#d94a4a';
      ctx.fill();
      ctx.strokeStyle = 'rgba(217, 74, 74, 0.5)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Draw "VS" text if game hasn't started
      if (!isRunning && !isGameOver) {
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('PRESS SPACE TO START', canvas.width / 2, canvas.height / 2);
      }

      // Draw game over
      if (isGameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff6b6b';
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = '#e0e0e0';
        ctx.font = '18px sans-serif';
        ctx.fillText('PRESS SPACE TO RESTART', canvas.width / 2, canvas.height / 2 + 20);
      }
    }

    function gameLoop() {
      updatePlayer();
      updateEnemy();

      if (isRunning && !isGameOver && checkCollision()) {
        isGameOver = true;
        statusDiv.textContent = 'Game Over! Press space to restart.';
      }

      draw();
      requestAnimationFrame(gameLoop);
    }

    // Start the game loop
    gameLoop();
  </script>
</body>
</html>
